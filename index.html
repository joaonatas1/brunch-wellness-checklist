<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4d3f">
<title>Checklist · Brunch Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#1f4d3f;--ouro:#b5893e;--fundo:#f4f3ee;--card:#fff;--texto:#1d1d1b;--cinza:#6b6b64;--linha:#e4e2d9;--ok:#2e7d4f;--erro:#b03a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer}

/* Topo fixo com progresso */
.topo{position:sticky;top:0;z-index:10;background:var(--verde);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
.topo h1{margin:0;font-size:17px;font-weight:700}
.topo .sub{font-size:12px;opacity:.8;margin-top:2px}
.progresso{display:flex;align-items:center;gap:12px;margin-top:12px}
.barra{flex:1;height:10px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden}
.barra div{height:100%;width:0;background:var(--ouro);transition:width .3s}
.pct{font-size:15px;font-weight:700;min-width:44px;text-align:right}
.resumo{font-size:13px;margin-top:8px;opacity:.9}

/* Busca e abas */
.controles{padding:12px 16px 0}
.busca input{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--linha);border-radius:12px;background:#fff;color:var(--texto)}
.busca input:focus{outline:2px solid var(--verde);outline-offset:-1px}
.abas{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#e7e5dc;border-radius:12px;padding:4px;margin-top:10px}
.abas button{background:transparent;border:0;color:var(--texto);padding:10px 4px;border-radius:9px;font-size:14px;font-weight:600}
.abas button[aria-selected="true"]{background:#fff;color:var(--verde);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.abas .n{font-weight:500;opacity:.7;margin-left:4px}

/* Lista de itens */
.lista{padding:8px 16px 0}
.card{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;user-select:none}
.card:active{background:#faf9f5}
.check{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid #bdb9ab;background:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px}
.check svg{width:16px;height:16px;opacity:0;transition:opacity .15s}
.card.feito .check{background:var(--ok);border-color:var(--ok)}
.card.feito .check svg{opacity:1}
.corpo{flex:1;min-width:0}
.nome{font-size:15px;font-weight:700;line-height:1.3}
.card.feito .nome{text-decoration:line-through;color:var(--cinza);font-weight:500}
.precisa{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--cinza)}
.precisa label{white-space:nowrap}
.precisa input{flex:1;min-width:0;font-size:16px;padding:9px 10px;border:1px solid var(--linha);border-radius:10px;background:#faf9f5;color:var(--texto)}
.precisa input:focus{outline:2px solid var(--verde);outline-offset:-1px;background:#fff}
.vazio{text-align:center;color:var(--cinza);padding:48px 16px;font-size:15px}
.vazio strong{display:block;color:var(--ok);font-size:18px;margin-bottom:6px}

/* Barra de ação fixa embaixo */
.rodape{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--linha);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.principal{flex:1;background:var(--verde);color:#fff;border:0;border-radius:12px;padding:15px;font-size:15px;font-weight:600}
.mais{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:0 18px;font-size:22px;line-height:1;color:var(--texto)}

/* Aviso rápido (com desfazer) */
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:30;background:#262624;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{background:transparent;border:0;color:#e9c98d;font-weight:700;font-size:14px;padding:6px 4px}
.toast.erro{background:var(--erro)}
.toast[hidden]{display:none}

/* Folha de opções */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end}
.fundo[hidden]{display:none}
.folha{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.folha h3{margin:0 0 12px;font-size:16px}
.folha .ajuda{font-size:13px;color:var(--cinza);margin:8px 0 16px}
.btn-perigo{width:100%;background:#fff;color:var(--erro);border:1px solid var(--erro);border-radius:12px;padding:14px;font-size:15px;font-weight:600}
.btn-sec{width:100%;background:#fff;color:var(--verde);border:1px solid var(--verde);border-radius:12px;padding:14px;font-size:15px;font-weight:600;margin-top:10px}
textarea{width:100%;height:200px;margin-top:12px;font:13px ui-monospace,Menlo,monospace;border:1px solid var(--linha);border-radius:10px;padding:10px;display:none}
</style>
</head>
<body>

<header class="topo">
  <h1>Checklist · Brunch Wellness</h1>
  <div class="sub">Domingo · 8h às 12h · 250 convidados · quantidades estimadas</div>
  <div class="progresso">
    <div class="barra"><div id="barra"></div></div>
    <div class="pct" id="pct">0%</div>
  </div>
  <div class="resumo" id="resumo"></div>
</header>

<section class="controles">
  <div class="busca">
    <input type="search" id="busca" placeholder="Buscar item (ex.: limão, copo, gelo)" aria-label="Buscar item" autocomplete="off">
  </div>
  <div class="abas" role="tablist">
    <button role="tab" data-aba="falta" aria-selected="true">Faltam<span class="n" id="nFaltam"></span></button>
    <button role="tab" data-aba="todos" aria-selected="false">Todos<span class="n" id="nTodos"></span></button>
    <button role="tab" data-aba="pronto" aria-selected="false">Prontos<span class="n" id="nProntos"></span></button>
  </div>
</section>

<main class="lista" id="lista"></main>

<nav class="rodape">
  <button class="principal" id="copiar">Copiar lista do que falta</button>
  <button class="mais" id="abrirMais" aria-label="Mais opções">⋯</button>
</nav>

<div class="toast" id="toast" hidden>
  <span id="toastTexto"></span>
  <button id="toastAcao" hidden>Desfazer</button>
</div>

<div class="fundo" id="folhaFundo" hidden>
  <div class="folha" role="dialog" aria-modal="true" aria-labelledby="tituloFolha">
    <h3 id="tituloFolha">Mais opções</h3>
    <button class="btn-perigo" id="limpar">Limpar tudo</button>
    <p class="ajuda">Apaga todas as marcações e as quantidades editadas. Essa ação vale para todas as pessoas que abrirem o link.</p>
    <textarea id="area" readonly></textarea>
    <button class="btn-sec" id="fechar">Fechar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bjoqnuqmwwkdsmptkukq.supabase.co";
const SUPABASE_KEY = "sb_publishable_jZVs3EPa-oBnMRu5YvprKw_Wlj61zOC";
const TABELA = "checklist_itens";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ITENS = [
 ["Abacate (guacamole)","~15 un"],
 ["Abacaxi (suco com hortelã)","~45 un ou ~30 L de polpa ou suco pronto"],
 ["Açúcar (bolos, limonada e xarope do mojito)","~13 kg"],
 ["Adoçante (hibisco gelado e café)","1 kit"],
 ["Álcool gel","2 L"],
 ["Amêndoas","~1 kg"],
 ["Banana-prata (mini tortilhas de banana)","~30 un"],
 ["Bowl descartável (bowls, granola, iogurte, salada)","300"],
 ["Canela em pó","1 pote"],
 ["Castanhas","~1 kg"],
 ["Cenoura (bolo de cenoura)","~5 kg"],
 ["Chá variado","200 sachês"],
 ["Chocolate meio amargo","~2 kg"],
 ["Café em pó para coar","3 kg"],
 ["Colher de servir","9"],
 ["Colher descartável (bowls, iogurte, salada, granola)","600"],
 ["Copo de 200 ml (água, sucos e limonada)","1.000"],
 ["Copo de 300 ml (coquetéis)","500"],
 ["Copo de papel de 300 ml com tampa (café e chá)","300"],
 ["Cream cheese","1 kg"],
 ["Cottage","1 kg"],
 ["Creme de leite","4 caixas"],
 ["Cuba ou bacia para gelo das jarras","4"],
 ["Cuba ou bandeja para as ilhas","9"],
 ["Damasco seco","1 kg"],
 ["Faca descartável","100"],
 ["Farinha de trigo (quiches e bolos)","9 kg"],
 ["Flor de hibisco seca","500 g"],
 ["Frutas para a salada (mamão, melão, abacaxi, morango, uva)","~25 kg"],
 ["Frutas inteiras (banana, maçã, pera)","~300 un"],
 ["Frutas vermelhas (morango, framboesa, amora)","~3 kg"],
 ["Garfinho descartável (bolo, quiche, omelete, tortilha)","400"],
 ["Geleias variadas","4 potes"],
 ["Gelo","~50 kg"],
 ["Gengibre (água com pepino e ginger lemonade)","1,5 kg"],
 ["Granola","~8 kg"],
 ["Guardanapo de papel","1.000"],
 ["Hortelã","11 maços"],
 ["Iogurte natural","~25 kg"],
 ["Jarra de 2 L (3 sucos com reserva e 4 coquetéis)","8"],
 ["Jarra de 3 L (4 águas aromatizadas)","4"],
 ["Laranja (suco ~150 kg, spritz ~6 kg, água e hibisco ~30 un)","~150 kg + ~6 kg + ~30 un"],
 ["Leite de amêndoa","6 L"],
 ["Leite tradicional","12 L"],
 ["Legumes (abobrinha, pimentão, cebola, tomate)","~6 kg"],
 ["Limão (salada, água, limonada, mojito, ginger e bolo)","~300 un"],
 ["Lixeira","6"],
 ["Luvas descartáveis","2 caixas"],
 ["Manteiga (quiches e pães)","4 kg"],
 ["Mel (salada e ginger lemonade)","2 kg"],
 ["Nozes","~1 kg"],
 ["Óleo (bolos)","6 L"],
 ["Ovos (quiches, omelete e bolos)","~38 dúzias"],
 ["Pão integral de forma, fatiado","12 pães"],
 ["Pão multigrãos de forma, fatiado","12 pães"],
 ["Papel toalha","10 rolos"],
 ["Pepino","8 un"],
 ["Peito de frango cozido e desfiado","3 kg"],
 ["Peito de peru fatiado","3 kg"],
 ["Pinça ou pegador (um por ilha, mais 2 reservas)","11"],
 ["Placas de alérgenos (glúten, lactose, castanhas, amendoim, ovo)","~30"],
 ["Presunto (quiches)","~3 kg"],
 ["Prato descartável (quiches, tortilhas, bolo)","300"],
 ["Queijo branco (tortilha de queijo com tomate)","2 kg"],
 ["Queijo minas frescal","3 kg"],
 ["Queijo para quiches","~4 kg"],
 ["Réchaud com álcool gel (quentes)","3"],
 ["Requeijão","1 kg"],
 ["Ricota temperada","1,5 kg"],
 ["Rúcula e folhas frescas","2 kg"],
 ["Sacos de lixo","2 pacotes"],
 ["Sal, pimenta e azeite","1 kit"],
 ["Ervas frescas (salsinha, cebolinha, orégano)","5 maços"],
 ["Tomate (tortilha de queijo com tomate)","4 kg"],
 ["Tomate cereja (confit)","2 kg"],
 ["Tônica zero","10 L"],
 ["Toalha de mesa para as ilhas","9"],
 ["Uva-passa","1 kg"],
 ["Água com gás (mojito e ginger lemonade)","30 L"],
 ["Água mineral em garrafão de 20 L (natural)","8 garrafões"]
].sort((a,b) => a[0].localeCompare(b[0], "pt-BR"));

const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let estado = {feito:{}, qtd:{}};
let aba = "falta";
let busca = "";
let edicaoPendente = false;
let timerToast = null;
let ultimoMarcado = null;

const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qtdDe = (nome, padrao) => estado.qtd[nome] !== undefined ? estado.qtd[nome] : padrao;
const estaPronto = nome => !!estado.feito[nome];

function mostrarToast(texto, comDesfazer, erro){
  const t = $("#toast");
  $("#toastTexto").textContent = texto;
  $("#toastAcao").hidden = !comDesfazer;
  t.classList.toggle("erro", !!erro);
  t.hidden = false;
  clearTimeout(timerToast);
  timerToast = setTimeout(() => { t.hidden = true; ultimoMarcado = null; }, 4500);
}

function atualizarCabecalho(){
  const total = ITENS.length;
  const prontos = ITENS.filter(it => estaPronto(it[0])).length;
  const faltam = total - prontos;
  const pct = total ? Math.round(prontos / total * 100) : 0;
  $("#barra").style.width = pct + "%";
  $("#pct").textContent = pct + "%";
  $("#resumo").textContent = prontos + " de " + total + " itens prontos · faltam " + faltam;
  $("#nFaltam").textContent = faltam;
  $("#nTodos").textContent = total;
  $("#nProntos").textContent = prontos;
  $("#copiar").textContent = "Copiar lista do que falta (" + faltam + ")";
}

function itensVisiveis(){
  const termo = busca.trim().toLowerCase();
  return ITENS.filter(it => {
    if (aba === "falta" && estaPronto(it[0])) return false;
    if (aba === "pronto" && !estaPronto(it[0])) return false;
    if (termo && !it[0].toLowerCase().includes(termo)) return false;
    return true;
  });
}

function render(){
  const visiveis = itensVisiveis();
  let html;
  if (visiveis.length === 0) {
    if (busca.trim()) html = '<div class="vazio">Nenhum item encontrado para "' + esc(busca) + '".</div>';
    else if (aba === "falta") html = '<div class="vazio"><strong>Tudo pronto ✔</strong>Nada faltando. Você pode conferir na aba "Prontos".</div>';
    else if (aba === "pronto") html = '<div class="vazio">Nenhum item marcado ainda. Toque em um item para marcar.</div>';
    else html = '<div class="vazio">Nenhum item.</div>';
  } else {
    html = visiveis.map(it => {
      const nome = it[0];
      const pronto = estaPronto(nome);
      return '<div class="card' + (pronto ? ' feito' : '') + '" data-nome="' + esc(nome) + '" role="checkbox" aria-checked="' + pronto + '" tabindex="0">' +
        '<div class="check">' + CHECK_SVG + '</div>' +
        '<div class="corpo">' +
          '<div class="nome">' + esc(nome) + '</div>' +
          '<div class="precisa"><label for="q-' + visiveis.indexOf(it) + '">Precisa</label>' +
          '<input id="q-' + visiveis.indexOf(it) + '" type="text" inputmode="text" data-qtd="' + esc(nome) + '" value="' + esc(qtdDe(nome, it[1])) + '"></div>' +
        '</div></div>';
    }).join("");
  }
  $("#lista").innerHTML = html;
  atualizarCabecalho();
}

async function salvarItem(nome){
  const {error} = await sb.from(TABELA).upsert({
    item_id: nome,
    feito: estaPronto(nome),
    qtd: estado.qtd[nome] !== undefined ? estado.qtd[nome] : null,
    atualizado_em: new Date().toISOString()
  }, {onConflict: "item_id"});
  if (error) { mostrarToast("Não foi possível salvar. Verifique a conexão.", false, true); console.error(error); }
}

function alternar(nome, desfazer){
  estado.feito[nome] = !estaPronto(nome);
  if (estado.feito[nome] && !desfazer) {
    ultimoMarcado = nome;
    mostrarToast("Marcado: " + nome, true);
  }
  render();
  salvarItem(nome);
}

async function carregar(){
  const {data, error} = await sb.from(TABELA).select("*");
  if (error) { mostrarToast("Não foi possível carregar a lista. Recarregue a página.", false, true); console.error(error); return; }
  estado = {feito:{}, qtd:{}};
  data.forEach(r => {
    estado.feito[r.item_id] = r.feito;
    if (r.qtd !== null) estado.qtd[r.item_id] = r.qtd;
  });
  render();
}

function escutarMudancas(){
  sb.channel("checklist")
    .on("postgres_changes", {event:"*", schema:"public", table:TABELA}, p => {
      if (p.eventType === "DELETE") {
        delete estado.feito[p.old.item_id];
        delete estado.qtd[p.old.item_id];
      } else {
        const r = p.new;
        estado.feito[r.item_id] = r.feito;
        if (r.qtd !== null) estado.qtd[r.item_id] = r.qtd; else delete estado.qtd[r.item_id];
      }
      // Não redesenha enquanto a pessoa está digitando em um campo de quantidade
      const emEdicao = document.activeElement && document.activeElement.matches("#lista input");
      if (emEdicao) edicaoPendente = true; else render();
    })
    .subscribe();
}

// Eventos
$("#lista").addEventListener("click", e => {
  if (e.target.closest("input")) return;
  const card = e.target.closest(".card");
  if (!card) return;
  alternar(card.dataset.nome, false);
});

$("#lista").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  if (e.target.matches("input")) return;
  const card = e.target.closest(".card");
  if (!card) return;
  e.preventDefault();
  alternar(card.dataset.nome, false);
});

const timersQtd = {};
$("#lista").addEventListener("input", e => {
  const t = e.target;
  if (!t.matches("input[data-qtd]")) return;
  const nome = t.dataset.qtd;
  estado.qtd[nome] = t.value;
  atualizarCabecalho();
  clearTimeout(timersQtd[nome]);
  timersQtd[nome] = setTimeout(() => salvarItem(nome), 700);
});

$("#lista").addEventListener("focusout", e => {
  if (!e.target.matches("input[data-qtd]")) return;
  if (edicaoPendente) { edicaoPendente = false; setTimeout(render, 0); }
});

$("#busca").addEventListener("input", e => { busca = e.target.value; render(); });

document.querySelectorAll(".abas button").forEach(b => {
  b.addEventListener("click", () => {
    aba = b.dataset.aba;
    document.querySelectorAll(".abas button").forEach(x => x.setAttribute("aria-selected", x === b ? "true" : "false"));
    render();
  });
});

$("#toastAcao").addEventListener("click", () => {
  if (!ultimoMarcado) return;
  const nome = ultimoMarcado;
  $("#toast").hidden = true;
  ultimoMarcado = null;
  alternar(nome, true);
});

// Folha de opções
function abrirFolha(){ $("#folhaFundo").hidden = false; }
function fecharFolha(){ $("#folhaFundo").hidden = true; $("#area").style.display = "none"; }
$("#abrirMais").addEventListener("click", abrirFolha);
$("#fechar").addEventListener("click", fecharFolha);
$("#folhaFundo").addEventListener("click", e => { if (e.target.id === "folhaFundo") fecharFolha(); });

let pendenteLimpar = false;
$("#limpar").addEventListener("click", async () => {
  const b = $("#limpar");
  if (!pendenteLimpar) {
    pendenteLimpar = true;
    b.textContent = "Toque de novo para confirmar";
    setTimeout(() => { pendenteLimpar = false; b.textContent = "Limpar tudo"; }, 4000);
    return;
  }
  pendenteLimpar = false;
  b.textContent = "Limpar tudo";
  const {error} = await sb.from(TABELA).delete().neq("item_id", "");
  if (error) { mostrarToast("Não foi possível limpar. Tente de novo.", false, true); console.error(error); return; }
  estado = {feito:{}, qtd:{}};
  fecharFolha();
  render();
  mostrarToast("Lista limpa.", false);
});

// Copiar lista do que falta
function gerarTexto(){
  const faltam = ITENS.filter(it => !estaPronto(it[0]));
  return "Lista do que falta · Brunch Wellness\n\n" +
    faltam.map(it => "- [ ] " + it[0] + " — " + qtdDe(it[0], it[1])).join("\n") + "\n";
}

async function copiar(){
  const txt = gerarTexto();
  try {
    await navigator.clipboard.writeText(txt);
    mostrarToast("Lista copiada. Já pode colar onde quiser.", false);
  } catch(e) {
    const area = $("#area");
    area.value = txt;
    area.style.display = "block";
    abrirFolha();
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch(e2) {}
    mostrarToast(ok ? "Lista copiada." : "Toque no texto da janela e copie.", false, !ok);
  }
}
$("#copiar").addEventListener("click", copiar);

render();
carregar();
escutarMudancas();
</script>
</body>
</html>
